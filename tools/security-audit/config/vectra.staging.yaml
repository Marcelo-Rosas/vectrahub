# Vectra Hub — staging / authorized active testing
preset: vectra.staging
mode: active

targets:
  spa:
    - https://staging.app.vectracargo.com.br
  supabase:
    base: https://lrbtbrpoklgwaaclbufz.supabase.co
    functions_sample:
      - lookup-cep
      - calculate-freight

cors_origins_test:
  - https://evil.com
  - https://attacker.com

user_enum:
  existing_email: '${SAAS_AUDIT_EXISTING_EMAIL}'
  nonexistent_email: no-such-user-99999@example.invalid

sqli_endpoints:
  - url: https://lrbtbrpoklgwaaclbufz.supabase.co/functions/v1/lookup-cep
    method: GET
    param: cep
    location: query

idor_resources:
  - url_template: https://lrbtbrpoklgwaaclbufz.supabase.co/rest/v1/quotes?id=eq.{id}
    owner_a_ids: ['00000000-0000-0000-0000-000000000001']
