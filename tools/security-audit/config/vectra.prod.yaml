# Vectra Hub — production passive audit preset
preset: vectra.prod
mode: passive

targets:
  spa:
    - https://app.vectracargo.com.br
    - https://app.feira.vectracargo.com.br
  supabase:
    base: https://lrbtbrpoklgwaaclbufz.supabase.co
    auth_paths:
      - /auth/v1/token?grant_type=password
      - /auth/v1/recover
      - /auth/v1/signup
    functions_sample:
      - calculate-freight
      - feira-save-quote
      - lookup-cep

cors_origins_test:
  - https://evil.com
  - https://attacker.com
  - null

headers_expected:
  - X-Frame-Options
  - Strict-Transport-Security
  - Content-Security-Policy

pii_paths_passive:
  - /
  - /auth

user_enum:
  # Set existing_email via env or override in staging for login compare
  nonexistent_email: no-such-user-99999@example.invalid
