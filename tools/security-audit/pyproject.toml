[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-security-audit"
version = "0.1.0"
description = "DAST security audit for SaaS APIs and web apps (Vectra Hub preset)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
dependencies = [
  "httpx>=0.27",
  "pyjwt>=2.8",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
saas-audit = "saas_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["saas_audit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
