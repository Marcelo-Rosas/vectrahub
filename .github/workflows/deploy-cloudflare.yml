name: Deploy Cargo Flow Navigator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detectar quais categorias de arquivos mudaram ───
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      migration: ${{ steps.filter.outputs.migration }}
      edge_function: ${{ steps.filter.outputs.edge_function }}
      edge_functions_list: ${{ steps.list-fns.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.*'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - 'package.json'
              - 'package-lock.json'
              - 'wrangler.json'
              - 'wrangler.toml'
            migration:
              - 'supabase/migrations/**'
            edge_function:
              - 'supabase/functions/**'

      - name: List altered Edge Functions
        id: list-fns
        if: steps.filter.outputs.edge_function == 'true'
        run: |
          set -euo pipefail
          # supabase/functions/_shared/... yields segment "_shared" — not a deployable function name (must start with a letter).
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'supabase/functions/' || true)
          VALID_NAMES=""
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            if [[ "$name" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]] && [[ -f "supabase/functions/$name/index.ts" ]]; then
              VALID_NAMES="${VALID_NAMES}${name}"$'\n'
            fi
          done < <(echo "$CHANGED" | cut -d'/' -f3 | sort -u)
          # _shared affects many functions: always redeploy all deployable folders (union with diff hits).
          if echo "$CHANGED" | grep -q '^supabase/functions/_shared/'; then
            for d in supabase/functions/*/; do
              [[ -d "$d" ]] || continue
              base=$(basename "$d")
              [[ "$base" == _shared ]] && continue
              [[ -f "${d}index.ts" ]] && VALID_NAMES="${VALID_NAMES}${base}"$'\n'
            done
          fi
          # Shared-only changes (no direct function folder in diff): redeploy every function with index.ts.
          if [[ -z "$(echo "$VALID_NAMES" | tr -d '[:space:]')" ]] && [[ -n "$(echo "$CHANGED" | tr -d '[:space:]')" ]]; then
            for d in supabase/functions/*/; do
              [[ -d "$d" ]] || continue
              base=$(basename "$d")
              [[ "$base" == _shared ]] && continue
              [[ -f "${d}index.ts" ]] && VALID_NAMES="${VALID_NAMES}${base}"$'\n'
            done
          fi
          FUNCS_LINES=$(echo "$VALID_NAMES" | sort -u | grep -v '^$' || true)
          if [[ -z "$FUNCS_LINES" ]]; then
            FUNCTIONS='[]'
          else
            FUNCTIONS=$(echo "$FUNCS_LINES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"

  # ─── Sync check: Edge types ↔ Client types ───
  check-freight-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check freight types in sync (VEC-124)
        run: npx tsx scripts/check-freight-types-sync.ts

  # ─── Supabase Migrations ───
  deploy-migrations:
    needs: detect-changes
    if: needs.detect-changes.outputs.migration == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            supabase link --project-ref lrbtbrpoklgwaaclbufz && break
            [ $attempt -eq 3 ] && exit 1
            echo "Link attempt $attempt failed — retrying in 20s..."
            sleep 20
          done

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            supabase db push && break
            [ $attempt -eq 3 ] && exit 1
            echo "Push attempt $attempt failed — retrying in 20s..."
            sleep 20
          done

  # ─── Supabase Edge Functions ───
  deploy-edge-functions:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.edge_function == 'true' &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.edge_functions_list != '[]' &&
      needs.detect-changes.outputs.edge_functions_list != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.edge_functions_list) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref lrbtbrpoklgwaaclbufz
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ${{ matrix.function }}
        run: supabase functions deploy ${{ matrix.function }} --project-ref lrbtbrpoklgwaaclbufz
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ─── Build + Deploy Cloudflare Pages ───
  deploy-frontend:
    needs: [detect-changes, deploy-migrations, check-freight-types]
    if: |
      always() &&
      (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.deploy-migrations.result == 'success' || needs.deploy-migrations.result == 'skipped') &&
      needs.check-freight-types.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Supabase types (if migration ran)
        if: needs.deploy-migrations.result == 'success'
        run: |
          npx supabase gen types typescript \
            --project-id lrbtbrpoklgwaaclbufz \
            > src/integrations/supabase/types.generated.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Patch wrangler for Pages
        run: node scripts/patch-wrangler-pages.mjs

      # Production deploy (push to main or manual dispatch)
      - name: Deploy to Cloudflare Pages (Production)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vectrahub --branch=main

      # Preview deploy (pull request)
      - name: Deploy to Cloudflare Pages (Preview)
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vectrahub --branch=pr-${{ github.event.pull_request.number }}

      # TMS usa login Supabase — Cloudflare Access nas URLs públicas bloqueia preview/produção.
      - name: Remove Cloudflare Access from public TMS URLs
        if: success()
        id: remove-access
        continue-on-error: true
        run: node scripts/disable-cloudflare-access-public.mjs --apply
        env:
          CLOUDFLARE_ZERO_TRUST_API_TOKEN: ${{ secrets.CLOUDFLARE_ZERO_TRUST_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Pages URL is not behind Cloudflare Access
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            URL="https://pr-${{ github.event.pull_request.number }}.vectrahub.pages.dev"
          else
            URL="https://app.vectracargo.com.br"
          fi
          echo "Checking $URL"
          HEADERS=$(curl -sI -L --max-redirs 3 "$URL" || true)
          echo "$HEADERS" | head -20
          if echo "$HEADERS" | grep -qi 'cloudflareaccess.com'; then
            echo "::error::URL ainda redireciona para Cloudflare Access. Adicione o secret CLOUDFLARE_ZERO_TRUST_API_TOKEN (template Edit Cloudflare Zero Trust) em GitHub Actions, ou remova o app em Zero Trust → Access → Applications."
            exit 1
          fi
          echo "OK: sem redirect para Cloudflare Access"

      - name: Access removal summary
        if: always()
        run: |
          echo "## Cloudflare Access" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.remove-access.outcome }}" = "success" ]; then
            echo "✅ Apps de Access removidos (ou já estavam públicos)." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Falha ao remover Access via API. Configure \`CLOUDFLARE_ZERO_TRUST_API_TOKEN\` ou remova manualmente em [Zero Trust → Access](https://one.dash.cloudflare.com/)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Preview deploy pronto!**\n\nURL: https://pr-${{ github.event.pull_request.number }}.vectrahub.pages.dev\n\nLogin via Supabase (sem Cloudflare Access). Commit: `' + context.sha.substring(0, 7) + '`'
            })

  # ─── Notificação final ───
  notify-status:
    needs: [detect-changes, deploy-migrations, deploy-edge-functions, deploy-frontend]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize deploy
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend changed | ${{ needs.detect-changes.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration changed | ${{ needs.detect-changes.outputs.migration }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Function changed | ${{ needs.detect-changes.outputs.edge_function }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ needs.deploy-migrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Functions | ${{ needs.deploy-edge-functions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
